name: GOUP 6.0 - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find or extract GOUP project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find . \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          if [ -z "$SETTINGS" ]; then
            ZIP_FILE="$(find . \
              -type f \
              -iname '*.zip' \
              -not -path './.git/*' \
              -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle project or project ZIP found."
              exit 1
            fi

            echo "Extracting project ZIP: $ZIP_FILE"
            mkdir -p _goup_extracted
            unzip -oq "$ZIP_FILE" -d _goup_extracted

            SETTINGS="$(find _goup_extracted \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.gradle/*' \
              -print -quit || true)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"

          if [ ! -f "$ROOT/app/build.gradle" ] && \
             [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found."
            echo "The project may be incomplete or ZIP structure is incorrect."
            exit 1
          fi

          echo "Project directory: $ROOT"
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory was not created."
            exit 1
          fi

          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOUP-6.0-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
